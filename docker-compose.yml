version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: cornerroom
      POSTGRES_PASSWORD: cornerroom
      POSTGRES_DB: cornerroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerroom -d cornerroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["api"]
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@postgres:5432/cornerroom
      DATABASE_URL_SYNC: postgresql+psycopg://cornerroom:cornerroom@postgres:5432/cornerroom
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://cornerroom.live"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./var/storage:/app/var/storage

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["worker"]
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cornerroom:cornerroom@postgres:5432/cornerroom
      DATABASE_URL_SYNC: psycopg://cornerroom:cornerroom@postgres:5432/cornerroom
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://cornerroom.live
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: production_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - web
      - api

  # Automatically renews your SSL certificates completely hands-free
  certbot:
    image: certbot/certbot
    container_name: production_certbot
    restart: always
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  pgdata:

